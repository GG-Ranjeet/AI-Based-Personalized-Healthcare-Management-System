services:
  backend:
    command: npm start      # Production start script (e.g., node build/index.js)
    environment:
      - MONGO_URI=mongodb://database:27017/production_db
    restart: always         # Restarts automatically if the server crashes

  frontend:
    ports:
      - "80:5173"           # Production port (standard HTTP port 80)
    environment:
      - VITE_PROXY_API_TARGET=http://backend:5000
    restart: always
